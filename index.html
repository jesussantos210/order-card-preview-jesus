<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel ="stylesheet" href="styles.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Order summary card</title>

</head>
<body>

    <main class ="card">
      <div class="card-header">
        <img src="images/illustration-hero.svg" alt="Illustration Hero">
      </div>

      <div class="card-content">
        <h1 class="card-title">Order Summary</h1>

        <p class="card-description">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>

        <div class ="plan-container">
          <div class="plan-info">
            <img src="images/icon-music.svg" alt="Music Icon">
            <div class="plan-text">
              <span class="plan-type">Annual Plan</span>
              <span class="plan-price">$59.99/year</span>
            </div>
          </div>
          <a href="#" class="change-link">Change</a>
      </div>

        <button class="btn-payment">Proceed to Payment</button>
        <a href="#" class="btn-cancel">Cancel Order</a>
     </div>
 </main>
    
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/jesussantos210">Jesus Santos</a>.
  </footer>
</body>
</html>
